<!doctype html>
<meta charset="utf-8">
<title>Cha'Annolog cartridge mockup</title>
<!--
  Task 6 (cont.) — the label on a cartridge shape.

  The shell here is an ORIGINAL shape, not a traced copy of anybody's
  cartridge: a rounded slab with a chamfered top-left corner, a ridged grip
  panel down the right, and a recessed label well. It exists to show Durrell
  how the label sits with a border around it — it is a presentation mockup,
  not a manufacturing drawing.

  Render:  bash brand/8bit/src/shoot.sh brand/8bit/label/mockup.html out.png 900 2 1100
-->
<style>
  :root { --ink:#141412; --deep:#067A76; --tiff:#09B1AB; --cream:#F7F3E8; --sepia:#E3DECB; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--cream); padding: 46px; font-family: Georgia, serif; }

  .stage { width: 720px; }
  .cart {
    width: 640px; height: 700px;
    background: var(--sepia);
    border: 8px solid var(--ink);
    border-radius: 16px 74px 16px 16px;   /* chamfer top-right, like a real shell */
    box-shadow: 14px 14px 0 var(--ink);   /* hard offset shadow, printed not rendered */
    position: relative;
    padding: 44px 40px;
  }
  /* ridged grip panel down the right edge */
  .grip {
    position: absolute; top: 120px; right: 16px; width: 26px; height: 470px;
    background-image: repeating-linear-gradient(
      to bottom, var(--ink) 0 5px, transparent 5px 15px);
  }
  /* recessed label well */
  .well {
    width: 100%; height: 330px;
    border: 6px solid var(--ink);
    background: var(--cream);
    padding: 12px;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .well img { width: 100%; display: block; image-rendering: pixelated; }

  .footer { margin-top: 34px; display: flex; justify-content: space-between;
            align-items: flex-end; }
  .shell-note { font-family: monospace; font-size: 15px; color: var(--ink);
                letter-spacing: .04em; }
  .ridges { width: 210px; height: 90px;
            background-image: repeating-linear-gradient(
              to right, var(--ink) 0 6px, transparent 6px 18px); }
  .cap { font-family: monospace; font-size: 14px; color: var(--deep);
         margin-top: 22px; letter-spacing: .03em; }
</style>

<div class="stage">
  <div class="cart">
    <div class="grip"></div>
    <div class="well"><img src="cartridge-print@300dpi.png" alt="Cha'Annolog label"></div>
    <div class="footer">
      <div class="shell-note">LC-001 &middot; CHA&rsquo;ANNOLOG</div>
      <div class="ridges"></div>
    </div>
  </div>
  <p class="cap">MOCKUP ONLY &middot; ORIGINAL SHELL SHAPE &middot; MEASURE YOUR CART BEFORE PRINTING</p>
</div>
