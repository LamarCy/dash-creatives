[build]
  base = "web"
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# Local `netlify dev` only: the CLI spawns the framework with a scrubbed
# env, so shebangs can't find node without an explicit PATH (macOS/Homebrew).
[context.dev.environment]
  PATH = "/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin"

# Store endpoints (Stripe checkout + gated downloads). Each function sets
# its own route via `export const config` — /store/checkout, /store/status,
# /store/download. Masters live in Netlify Blobs (store "singles"), never in git.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# NOTE: /music is a real page (src/pages/music.astro), not a redirect. It used
# to 302 to /?world=lamarcy#singles, but Netlify drops incoming query params
# when the destination already carries its own — which silently killed the ?s=
# attribution. Do not reintroduce that redirect.

[[redirects]]
  from = "/api/*"
  to = "https://dash-creatives-api.onrender.com/api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The gateway assets had NO cache header, so every repeat visit re-downloaded
# ~700KB of fonts and art — bandwidth is what burns Netlify credits. Fonts are
# immutable; art gets a week with background revalidation. To force a refresh
# after editing an image, append ?v=N at the usage site (same trick the audio
# player uses).
[[headers]]
  for = "/gateway/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gateway/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The memorial line shipped briefly at /pet-urns before being renamed; keep the
# old path working for anything already shared. No query-param concern here —
# the destination carries none (see the /music note above).
[[redirects]]
  from = "/pet-urns"
  to = "/memorials"
  status = 301

[[redirects]]
  from = "/pet-urns/*"
  to = "/memorials/:splat"
  status = 301

# Sculpture photography and the turntable sprite are ~2.6MB and immutable in
# practice; bandwidth is what burns Netlify credits. Same posture as /gateway.
[[headers]]
  for = "/memorials/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"
